spring.application.name=portfolio-server
   server.port=${PORT:8080}

# In-memory H2 database for development (data resets on restart).
# Swap for PostgreSQL later by changing these and adding the postgres driver.
spring.datasource.url=jdbc:h2:mem:portfolio
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# Origins allowed to call the API from a browser (comma-separated)
app.cors.allowed-origins=http://localhost:5173